<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi Mind Map</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Menghubungkan CSS Eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col bg-slate-50 h-screen overflow-hidden font-sans text-slate-800">
    
    <!-- Navbar / Header Profesional -->
    <header class="z-10 flex justify-between items-center bg-blue-900 shadow-lg p-4 text-white">
        <h1 class="flex items-center gap-2 font-semibold text-xl tracking-wide">
            <svg class="w-6 h-6 text-blue-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
            </svg>
            Sistem Pemetaan Mind Map
        </h1>
        <p class="text-blue-200 text-sm">Gunakan scroll untuk zoom, drag untuk geser</p>
    </header>

    <!-- Kontainer utama untuk Kanvas D3 -->
    <main class="relative flex-grow bg-white shadow-inner w-full h-full" id="mindmap-container">
        <!-- SVG Mind Map akan di-render di dalam sini oleh script.js -->
    </main>

    <!-- Menghubungkan JavaScript Eksternal -->
    <script src="script.js"></script>
</body>
</html>
